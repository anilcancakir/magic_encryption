name: magic_encryption_example
description: Encrypts and decrypts a string with Crypt, using an app key supplied in the Magic config.
publish_to: 'none'

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  magic: ^0.1.0
  magic_encryption:
    path: ../

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
