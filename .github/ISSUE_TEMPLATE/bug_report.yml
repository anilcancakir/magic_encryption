name: Bug Report
description: Report a bug in magic_encryption
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. A bug is easier to fix when it names the call that was wrong:
        `Crypt.encrypt`, `Crypt.decrypt`, the encrypter or `key:generate`.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: |
        For example:
        1. Register `EncryptionServiceProvider` and boot the app
        2. Call `Crypt.encrypt('secret')`
        3. Call `Crypt.decrypt` on the result
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - macOS
        - Windows
        - Linux
        - Web
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: magic_encryption Version
      placeholder: "0.0.1"
    validations:
      required: true

  - type: textarea
    id: flutter-doctor
    attributes:
      label: flutter doctor -v
      render: shell
